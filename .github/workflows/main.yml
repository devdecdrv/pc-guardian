name: Build & Release PC Guardian

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc-guardian

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show repo structure (debug)
        shell: pwsh
        run: |
          Write-Host "=== Working directory ==="
          Get-Location
          Write-Host "=== Files ==="
          Get-ChildItem -Force | Select-Object Name
          if (Test-Path "main.py") { Write-Host "main.py FOUND" } else { Write-Host "main.py MISSING" }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Determine version tag
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build exe with PyInstaller
        shell: pwsh
        run: |
          $args = @(
            "--onefile",
            "--noconsole",
            "--name", "PCGuardian",
            "--hidden-import", "pynput.keyboard._win32",
            "--hidden-import", "pynput.mouse._win32",
            "--hidden-import", "win32api",
            "--hidden-import", "win32con",
            "--hidden-import", "win32gui",
            "--hidden-import", "win32service",
            "--hidden-import", "win32serviceutil",
            "--hidden-import", "flask",
            "--hidden-import", "telebot",
            "--hidden-import", "cv2",
            "--hidden-import", "pyttsx3.drivers",
            "--hidden-import", "pyttsx3.drivers.sapi5",
            "--collect-all", "pyttsx3",
            "--collect-all", "cv2"
          )

          if (Test-Path "assets") {
            $args += "--add-data"; $args += "assets;assets"
          }
          if (Test-Path "dashboard/templates") {
            $args += "--add-data"; $args += "dashboard/templates;dashboard/templates"
          }
          if (Test-Path "dashboard/static") {
            $args += "--add-data"; $args += "dashboard/static;dashboard/static"
          }
          if (Test-Path "assets/icon.ico") {
            $args += "--icon"; $args += "assets/icon.ico"
          }

          $args += "main.py"

          Write-Host "Running: pyinstaller $args"
          & pyinstaller @args

      - name: Verify build output
        shell: pwsh
        run: |
          if (Test-Path "dist/PCGuardian.exe") {
            $size = (Get-Item "dist/PCGuardian.exe").Length / 1MB
            Write-Host "Build SUCCESS — PCGuardian.exe ($([math]::Round($size,1)) MB)"
          } else {
            Write-Host "BUILD FAILED — exe not found in dist/"
            exit 1
          }

      - name: Rename exe with version
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"
          Rename-Item "dist\PCGuardian.exe" "PCGuardian-$version-windows-x64.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: "PC Guardian ${{ steps.get_version.outputs.VERSION }}"
          body: |
            ## PC Guardian ${{ steps.get_version.outputs.VERSION }}

            ### First time setup
            1. Download `PCGuardian-${{ steps.get_version.outputs.VERSION }}-windows-x64.exe`
            2. Run it — setup wizard starts automatically on first launch
            3. Enter your Telegram bot token, your user ID, and a password
            4. Optional: run with `--install-service` as Administrator to start at boot

            ### Features
            - Full-screen lock engine with input blocking
            - Telegram bot — complete remote control from your phone
            - Camera / microphone / speaker access
            - Activity & behavior monitoring
            - Auto-schedule — school hours, bedtime, homework mode
            - Tamper detection & password-protected uninstall guard
            - Local web dashboard at `http://localhost:8080`
          files: pc-guardian/dist/PCGuardian-${{ steps.get_version.outputs.VERSION }}-windows-x64.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
