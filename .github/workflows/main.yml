name: Build PCGuard Driver + EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WDK
        shell: pwsh
        run: |
          $url = "https://go.microsoft.com/fwlink/?linkid=2249371"
          $out = "$env:TEMP\wdksetup.exe"
          Write-Host "Downloading WDK..."
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          Write-Host "Installing WDK..."
          Start-Process -FilePath $out -ArgumentList "/quiet /norestart /features OptionId.WindowsDriverKitComplete" -Wait
          Write-Host "WDK install done."

      - name: Find WDK version
        id: wdk
        shell: pwsh
        run: |
          $kits = "C:\Program Files (x86)\Windows Kits\10\Include"
          if (Test-Path $kits) {
            $ver = Get-ChildItem $kits | Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty Name
            Write-Host "Found WDK version: $ver"
            echo "WDK_VER=$ver" >> $env:GITHUB_OUTPUT
            echo "WDK_FOUND=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "WDK not found"
            echo "WDK_FOUND=false" >> $env:GITHUB_OUTPUT
          }

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Build PCGuard.sys
        if: steps.wdk.outputs.WDK_FOUND == 'true'
        shell: pwsh
        run: |
          $ver  = "${{ steps.wdk.outputs.WDK_VER }}"
          $inc  = "C:\Program Files (x86)\Windows Kits\10\Include\$ver"
          $lib  = "C:\Program Files (x86)\Windows Kits\10\Lib\$ver"

          New-Item -ItemType Directory -Force -Path build_drv | Out-Null
          Copy-Item pc-guardian\driver\PCGuard.cpp build_drv\
          Copy-Item pc-guardian\driver\PCGuard.h   build_drv\
          Set-Location build_drv

          $cl_args = @(
            "/nologo", "/kernel", "/GS-", "/W3", "/WX-", "/Gz",
            "/GF", "/Gm-", "/EHsc", "/Zp8", "/GR-",
            "/D_AMD64_", "/DNTDDI_VERSION=0x0A000007",
            "/D_WIN32_WINNT=0x0A00", "/DWIN32=100", "/DDBG",
            "/I`"$inc\km`"",
            "/I`"$inc\shared`"",
            "/c", "PCGuard.cpp"
          )
          & cl.exe @cl_args
          if ($LASTEXITCODE -ne 0) { Write-Error "cl.exe failed"; exit 1 }

          $link_args = @(
            "/DRIVER", "/SUBSYSTEM:NATIVE", "/ENTRY:DriverEntry",
            "/NODEFAULTLIB", "/MACHINE:X64",
            "/LIBPATH:`"$lib\km\x64`"",
            "ntoskrnl.lib", "hal.lib", "wdm.lib", "wdmsec.lib",
            "/OUT:PCGuard.sys", "PCGuard.obj"
          )
          & link.exe @link_args
          if ($LASTEXITCODE -ne 0) { Write-Error "link.exe failed"; exit 1 }

          if (Test-Path PCGuard.sys) {
            Write-Host "PCGuard.sys built successfully"
          } else {
            Write-Error "PCGuard.sys not found after build"
            exit 1
          }

      - name: Copy driver to assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pc-guardian\assets | Out-Null
          if (Test-Path build_drv\PCGuard.sys) {
            Copy-Item build_drv\PCGuard.sys pc-guardian\assets\PCGuard.sys
            Write-Host "Driver copied to assets"
          } else {
            Write-Host "No driver - EXE will run without kernel driver"
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        shell: cmd
        run: pip install -r pc-guardian/requirements.txt pyinstaller pillow

      - name: Create missing folders
        shell: cmd
        run: |
          if not exist pc-guardian\logs   mkdir pc-guardian\logs
          if not exist pc-guardian\config mkdir pc-guardian\config

      - name: Build EXE
        shell: pwsh
        run: |
          $args = @(
            "--onefile", "--noconsole", "--clean",
            "--name", "Windows Security",
            "--icon", "pc-guardian/assets/app.ico",
            "--runtime-tmpdir", ".",
            "--hidden-import", "pynput.keyboard._win32",
            "--hidden-import", "pynput.mouse._win32",
            "--hidden-import", "win32api",
            "--hidden-import", "win32con",
            "--hidden-import", "win32gui",
            "--hidden-import", "win32com",
            "--hidden-import", "winerror",
            "--hidden-import", "comtypes",
            "--hidden-import", "flask",
            "--hidden-import", "cryptography",
            "--hidden-import", "Crypto",
            "--hidden-import", "Crypto.Cipher",
            "--hidden-import", "Crypto.Cipher.Salsa20",
            "--paths", "pc-guardian"
          )
          if (Test-Path "pc-guardian\assets\PCGuard.sys") {
            $args += @("--add-data", "pc-guardian/assets/PCGuard.sys;assets")
            Write-Host "Bundling driver with EXE"
          }
          $args += "pc-guardian/main.py"
          & pyinstaller @args
          if ($LASTEXITCODE -ne 0) { Write-Error "PyInstaller failed"; exit 1 }

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $date = Get-Date -Format "yyyy.MM.dd-HHmm"
          $sha  = "${{ github.sha }}".Substring(0,7)
          echo "tag=v$date-$sha" >> $env:GITHUB_OUTPUT
          echo "name=Windows Security $date build $sha" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: |
            Auto-built from commit ${{ github.sha }}
            **Changes:** ${{ github.event.head_commit.message }}
          files: "dist/Windows Security.exe"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
