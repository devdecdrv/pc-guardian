name: Build PC Guardian EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # manual trigger button on GitHub

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --noconsole `
            --name "pc-guardian" `
            --add-data "assets;assets" `
            --add-data "dashboard/templates;dashboard/templates" `
            --add-data "dashboard/static;dashboard/static" `
            --hidden-import pynput.keyboard._win32 `
            --hidden-import pynput.mouse._win32 `
            --hidden-import win32api `
            --hidden-import win32con `
            --hidden-import win32gui `
            main.py

      - name: Get version tag
        id: version
        run: |
          $date = Get-Date -Format "yyyy.MM.dd-HHmm"
          $sha  = "${{ github.sha }}".Substring(0,7)
          echo "tag=v$date-$sha" >> $env:GITHUB_OUTPUT
          echo "name=PC Guardian $date (build $sha)" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: |
            Auto-built from commit ${{ github.sha }}
            
            **Changes in this build:**
            ${{ github.event.head_commit.message }}
            
            **How to use:**
            1. Download `pc-guardian.exe`
            2. Run it once — config auto-creates
            3. Open Telegram and test with `/status`
          files: dist/pc-guardian.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
